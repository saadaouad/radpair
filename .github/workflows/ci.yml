name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Build & Test pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: radpair_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d radpair_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/radpair_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure the test database
        run: |
          cat > apps/api/.env.test <<'EOF'
          NODE_ENV=test
          APP_ENV=test
          HOST=0.0.0.0
          PORT=3001
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/radpair_test
          DATABASE_POOL_MIN=0
          DATABASE_POOL_MAX=3
          CORS_ORIGIN=http://localhost:5173
          LOG_LEVEL=silent
          EOF

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migrate and seed
        run: pnpm --filter api db:migrate && pnpm --filter api db:seed

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
